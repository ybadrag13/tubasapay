<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f8a6c">
  <title>TsubuPay</title>
  <link rel="stylesheet" href="/lib/styles.css">
  <link rel="icon" href="/lib/icon.svg">
</head>
<body>
  <div class="app">
    <header class="topbar"><div class="logo"><span class="logo-dot"></span>TsubuPay</div></header>
    <main>
      <div class="card">
        <h2>Small payments, one scan.</h2>
        <p class="muted">TsubuPay (粒, a grain) is a barcode and QR payment system with a customer wallet and a shop register.</p>
      </div>
      <a class="btn" href="/user/">I'm a customer: open the wallet</a>
      <a class="btn secondary" href="/shop/">I run a shop: open the register</a>
      <p class="muted center">Prototype: top-ups and payouts are simulated. No real money moves.</p>
    </main>
  </div>
</body>
</html>
